version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - npm ci
    build:
      commands:
        # A failing test fails the deploy.
        - npm run test
        # `next build` type-checks as part of the build, so there is no separate step.
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
